{% extends "base.html" %}

{% block title %}Administración | BiblioTEC{% endblock %}

{% block content %}
<section class="section container">
    <div class="section-heading">
        <span class="eyebrow">Panel administrativo</span>
        <h1>Resumen de BiblioTEC</h1>
    </div>

    <div class="card-grid">
        <article class="book-card"><h3>Usuarios</h3><p>{{ total_usuarios }}</p></article>
        <article class="book-card"><h3>Libros</h3><p>{{ total_libros }}</p></article>
        <article class="book-card"><h3>Préstamos</h3><p>{{ total_prestamos }}</p></article>
        <article class="book-card"><h3>Reservas</h3><p>{{ total_reservas }}</p></article>
    </div>
</section>
{% endblock %}
