
{% block content %}
<section class="section container">
    <div class="section-heading">
        <span class="eyebrow">Crear cuenta</span>
        <h1>Regístrate en BiblioTEC</h1>
    </div>

    <form class="form-card" method="post">
        <label for="nombres">Nombres</label>
        <input id="nombres" name="nombres" type="text" required>

        <label for="apellidos">Apellidos</label>
        <input id="apellidos" name="apellidos" type="text" required>

        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" required>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" minlength="6" required>

        <button class="btn primary" type="submit">Crear cuenta</button>
    </form>

    <p>¿Ya tienes una cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>.</p>
</section>
{% endblock %}
