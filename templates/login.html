{% extends "base.html" %}

{% block title %}Ingresar | BiblioTEC{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <span class="eyebrow">Acceso</span>
        <h1>Iniciar sesión</h1>
        <p>Ingresa con la cuenta que registraste desde BiblioTEC.</p>

        <form class="form-card" method="post">
            <div class="field">
                <label for="correo">Correo electrónico</label>
                <input id="correo" name="correo" type="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <button class="btn primary full" type="submit">Ingresar</button>
        </form>

        <p class="auth-link">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a>.</p>
    </div>
</section>
{% endblock %}
